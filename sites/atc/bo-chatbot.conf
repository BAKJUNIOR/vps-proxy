# bo-chatbot.africatalentconsulting.com — back-office du chatbot ATC (conteneur atc-chatbot-bo).
# Tant que le back-office n'est pas déployé, ce domaine répond 502 : c'est normal.
server {
    listen 80;
    listen [::]:80;
    server_name  bo-chatbot.africatalentconsulting.com;

    # Porte que Let's Encrypt utilise pour vérifier qu'on contrôle bien ce domaine (et pour le renouvellement).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name  bo-chatbot.africatalentconsulting.com;

    # Même certificat que api-chatbot (il couvre les deux domaines).
    ssl_certificate     /etc/letsencrypt/live/api-chatbot.africatalentconsulting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-chatbot.africatalentconsulting.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Conteneur cherché à chaque requête : le proxy démarre même si le back-office n'existe pas encore.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $chatbot_bo http://atc-chatbot-bo:80;

    location / {
        proxy_set_header Host $host;
        proxy_pass $chatbot_bo;
    }
}

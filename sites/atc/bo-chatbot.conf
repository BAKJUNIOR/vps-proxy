# bo-chatbot.africatalentconsulting.com — projet ATC (chatbot).
# Étape 1 : port 80 seulement, le temps d'obtenir le certificat Let's Encrypt.
# Le bloc 443 sera ajouté une fois le certificat présent (sinon nginx refuse de démarrer).
server {
    listen 80;
    listen [::]:80;
    server_name  bo-chatbot.africatalentconsulting.com;

    # Porte que Let's Encrypt utilise pour vérifier qu'on contrôle bien ce domaine (et pour le renouvellement).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

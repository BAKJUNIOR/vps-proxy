# api-chatbot.africatalentconsulting.com — backend du chatbot ATC (conteneur atc-chatbot-back).
server {
    listen 80;
    listen [::]:80;
    server_name  api-chatbot.africatalentconsulting.com;

    # Porte que Let's Encrypt utilise pour vérifier qu'on contrôle bien ce domaine (et pour le renouvellement).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name  api-chatbot.africatalentconsulting.com;

    # Un seul certificat pour api-chatbot et bo-chatbot.
    ssl_certificate     /etc/letsencrypt/live/api-chatbot.africatalentconsulting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-chatbot.africatalentconsulting.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Images des formations envoyées depuis le back-office.
    client_max_body_size 10M;

    # Le conteneur est cherché à chaque requête (DNS interne de Docker) et non au démarrage de nginx :
    # si le chatbot est arrêté, seul ce domaine répond 502, les autres sites du VPS continuent de tourner.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $chatbot_back http://atc-chatbot-back:8080;

    # Déclarés ici (et jamais dans les location) pour s'appliquer partout : une location qui
    # définit un proxy_set_header n'hérite plus d'aucun de ceux du server.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Flux temps réel de la boîte de réception (SSE) : les événements doivent partir tout de suite,
    # et la connexion reste ouverte longtemps.
    location /api/v1/inbox/stream {
        proxy_pass $chatbot_back;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass $chatbot_back;
    }
}
